contracts_folder: tests/data/contracts/ethereum/local

ethereum:
  local:
    default_provider: hardhat
  mainnet:
    default_provider: node

polygon:
  local:
    default_provider: hardhat
  amoy:
    default_provider: node

node:
  ethereum:
    mainnet:
      uri: https://eth.drpc.org
    sepolia:
      uri: https://sepolia.gateway.tenderly.co
    holesky:
      # Holesky sunset: no free public archive RPC remaining (drpc paid-only;
      # publicnode/tenderly/1rpc/ankr free endpoints dead or key-gated).
      # Kept for test_fork_config; do not start holesky forks in CI.
      uri: https://ethereum-holesky-rpc.publicnode.com
  polygon:
    amoy:
      uri: https://polygon-amoy.drpc.org

hardhat:
  request_timeout: 29
  fork_request_timeout: 360
  bin_path: "./node_modules/.bin/hardhat"

  fork:
    ethereum:
      mainnet:
        upstream_provider: node
        block_number: 17040366
        host: 127.0.0.1:7110
      sepolia:
        upstream_provider: node
        block_number: 3091950
        host: 127.0.0.1:7112
      holesky:
        upstream_provider: node
        block_number: 100
        host: 127.0.0.1:7116

    polygon:
      amoy:
        upstream_provider: node
        host: 127.0.0.1:7113

test:
  # `false` because running pytest within pytest.
  disconnect_providers_after: false

  gas:
    exclude:
      - method_name: setAdd*

  balance: 100_000 ETH
