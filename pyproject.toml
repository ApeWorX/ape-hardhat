[build-system]
requires = ["setuptools>=75.6.0", "setuptools_scm[toml]>=5.0"]
build-backend = "setuptools.build_meta"

[project]
name = 'ape-hardhat'
description = 'ape-hardhat: Ape network provider for Hardhat'
readme = "README.md"
license = {text = 'Apache-2.0'}
authors = [
    {name = "ApeWorX Ltd.", email = "admin@apeworx.io"}
]
classifiers = [
    'Development Status :: 5 - Production/Stable',
    'Intended Audience :: Developers',
    'License :: OSI Approved :: MIT License',
    'Natural Language :: English',
    'Operating System :: MacOS',
    'Operating System :: POSIX',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3.10',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3.14',
]
requires-python = ">=3.10"
dependencies = [
    'eth-ape>=0.8.21,<0.9',
    'ethpm-types>=0.6.19,<0.7',
    'evm-trace>=0.2.3,<0.3',
    'web3>=6.20.1,<8',
    'chompjs>=1.1.9,<2',
    'requests>=2.28.1,<3',
    'hexbytes>=0.3.1,<2',
    'packaging>=23.0,<24',
    'yarl>=1.9.2,<2',
]
dynamic = ["version"]

[project.urls]
Homepage = 'https://github.com/ApeWorX/ape-hardhat'
Documentation = 'https://github.com/ApeWorX/ape-hardhat/blob/main/README.md'
Source = 'https://github.com/ApeWorX/ape-hardhat'
Tracker = 'https://github.com/ApeWorX/ape-hardhat/issues'

[dependency-groups]
test = [
    'pytest>=6.0',
    'pytest-mock',
    'pytest-xdist',
    'pytest-cov',
    'hypothesis>=6.2.0,<7.0',
    'ape-alchemy',
    'ape-polygon',
    'rich',
]
lint = [
    'mypy>=1.13.0,<2',
    'ruff>=0.8.0,<1',
    'types-setuptools',
    'types-requests',
    'types-PyYAML',
    'mdformat>=0.7.19',
    'mdformat-gfm>=0.3.5',
    'mdformat-frontmatter>=0.4.1',
    'mdformat-pyproject>=0.0.2',
]
docs = [
    'sphinx-ape',
]
release = [
    'setuptools>=75.6.0',
    'setuptools-scm',
    'wheel',
    'twine',
]
dev = [
    {include-group = "test"},
    {include-group = "lint"},
    {include-group = "docs"},
    {include-group = "release"},
    "commitizen>=2.40,<2.41",
    "prek",
    "pytest-watch",
    "IPython",
    "ipdb",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
exclude = ["tests*"]

[tool.setuptools.package-data]
ape_hardhat = ['py.typed']

[tool.mypy]
exclude = ["build/", "tests/functional/data/"]
plugins = ["pydantic.mypy"]
[tool.setuptools_scm]
write_to = "ape_hardhat/version.py"

# NOTE: you have to use single-quoted strings in TOML for regular expressions.
# It's the equivalent of r-strings in Python.  Multiline strings are treated as
# verbose regular expressions by Black.  Use [ ] to denote a significant space
# character.
[tool.pytest.ini_options]
norecursedirs = "projects"
addopts = """
    -p no:ape_test
    -p no:pytest_ethereum
    --cov-branch
    --cov-report term
    --cov-report html
    --cov-report xml
    --cov=ape_hardhat
"""
python_files = "test_*.py"
testpaths = "tests"
markers = """
fuzzing: Run Hypothesis fuzz test suite
fork: Run without x-dist
manual: Tests you want to avoid running in automated CI/CD because of expense
"""
[tool.mdformat]
number = false
wrap = 100
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "C4",
    "DTZ",
    "T10",
    "T20",
    "PYI",
    "PT",
    "RET",
    "SIM",
    "TC",
    "ARG",
]
ignore = [
    "E501",
    "ARG001",
    "ARG002",
    "ARG005",
    "B017",
    "B904",
    "N812",
    "N815",
    "PT011",
    "PT017",
    "PYI051",
    "SIM102",
    "SIM105",
    "SIM108",
    "SIM117",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "E402"]
"version.py" = ["T201"]
"exceptions.py" = ["N818"]
"tests/*" = ["T201", "ARG"]

[tool.ruff.lint.isort]
force-single-line = false
known-first-party = ['ape_hardhat']

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
